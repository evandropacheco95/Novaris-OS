name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write packages/database/.env
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > packages/database/.env

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
